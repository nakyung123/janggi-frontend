# 바깥에서 보는 감시. 사이트·백엔드는 15분 간격, DB 는 6시간 간격으로 걸어 두었다(scripts/watch.mjs 머리 주석).
# 장애가 나면 "장애" 이슈를 열고, 회복하면 닫는다. 이슈를 열고 닫을 때 GitHub 가 메일을 보낸다.
#
# 알아 둘 것
# - **실제로는 몇 시간에 한 번 돈다.** GitHub 는 예약 실행을 될 때만 돌린다. 2026-10-26~27 에 10시간 반
#   동안 3번 돌았고 DB 실행은 한 번도 안 돌았다. 장애를 알아채는 데 몇 시간 걸릴 수 있다.
#   제때 알려면 다른 감시(예: Google Cloud Monitoring 가동 확인)가 필요하다. 사용자가 적고(하루 5명 안팎)
#   그쪽 알림이 2027-09 부터 유료라 지금은 이것만 둔다.
# - 저장소에 60일 동안 활동이 없으면 GitHub 가 예약 실행을 멈춘다. 멈추면 Actions 화면에서 다시 켠다.
# - 끄려면: gh workflow disable watch.yml
name: watch

on:
  schedule:
    # 정각·15분 단위를 피한다. GitHub 는 그 무렵 몰리는 예약을 늦추거나 건너뛴다(문서). 처음에
    # */15 로 두었을 때 푸시하고 40분 동안 예약 실행이 한 번도 돌지 않았다.
    - cron: "4,19,34,49 * * * *"
    # DB 를 보는 실행. 위 실행과 겹치지 않게 7분에 둔다.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      db:
        description: "DB 까지 본다"
        type: boolean
        default: false
      fail:
        description: "알림 시험: 이 대상을 일부러 실패시킨다"
        type: choice
        options: [none, site, backend, db]
        default: none

permissions:
  contents: read
  issues: write

# 앞 실행이 30초씩 다시 해 보는 중에 다음 실행이 겹쳐 이슈를 두 번 열지 않게 한다.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 감시
        env:
          GH_TOKEN: ${{ github.token }}
          # 입력값은 명령 줄에 바로 넣지 않고 환경 변수로 받는다(셸 주입을 막는다).
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_DB: ${{ inputs.db }}
          INPUT_FAIL: ${{ inputs.fail }}
        run: |
          set -- --issues
          if [ "$SCHEDULE" = "7 */6 * * *" ] || [ "$INPUT_DB" = "true" ]; then set -- "$@" --db; fi
          case "$INPUT_FAIL" in
            site|backend|db) set -- "$@" --fail "$INPUT_FAIL" ;;
          esac
          node scripts/watch.mjs "$@"
