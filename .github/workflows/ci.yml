# 푸시할 때마다 깨끗한 리눅스에서 다시 확인한다.
#
# 여기서만 잡히는 것이 있다. 테스트는 그동안 **윈도우에서만** 돌았다. Vercel 은
# 배포마다 타입 검사와 빌드를 하지만 테스트는 돌리지 않는다. 그 빈자리가 이 파일이다.
#
# 리눅스와 윈도우가 갈리는 자리는 보통 셋이다 - 파일 이름 대소문자, 시간대, 줄바꿈.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Action 은 태그가 아니라 커밋으로 부른다. 태그는 주인이, 또는 그 계정을 턴 사람이
      # 다른 코드로 옮길 수 있다(2025-03 tj-actions/changed-files). 판을 올릴 때는 해시와
      # 뒤의 판 주석을 같이 바꾼다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vercel 이 쓰는 것과 맞춘다. 다르면 여기서 통과한 것이 배포에서 깨질 수 있다.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npx tsc -b

      - name: 테스트
        run: npx vitest run

      # 보내는 측정 이벤트 이름이 서버(janggi-backend main)의 목록에 다 있는지 본다. 서버가
      # 모르는 이름은 400 으로 거절되고, 답을 안 읽으므로 기록만 조용히 버려진다.
      - name: 이벤트 이름이 서버 목록에 있는지
        run: node scripts/check-event-names.mjs

      # 응답 헤더를 vercel.json(배포본)과 vite.config.ts(미리보기·개발 서버) 세 곳에 손으로
      # 맞춰 둔다. 어긋나면 로컬에서 본 것이 배포본과 다르고, 격리 헤더가 빠지면 엔진이 안 뜬다.
      - name: 헤더가 세 곳에서 같은지
        run: node scripts/check-headers.mjs

      # `npm run build` 가 아니라 `vite build` 를 직접 부른다.
      #
      # `npm run build` 는 prebuild 로 scripts/fetch-engine.mjs 를 돌리는데, 그것이
      # **구글 드라이브에서 11MB 를 받는다.** 구글 드라이브는 데이터센터에서 막히거나
      # 안내 페이지를 돌려주는 일이 잦아서, 우리 코드가 멀쩡한데 CI 가 빨간불이 된다.
      # 빨간불이 우리 탓인지 바깥 탓인지 모르게 되면 아무도 CI 를 안 믿는다.
      #
      # 그 스크립트는 **Vercel 이 배포마다 돌리므로** 거기서 확인된다. 엔진 파일은
      # public/ 에 그냥 복사되는 정적 파일이라 번들 결과를 바꾸지 않는다.
      - name: 빌드
        run: npx vite build

      # 한글이 깨져 들어간 적이 있다. 2026-10-08 에 자동 PR 이 src/App.tsx 의 한글 세
      # 글자를 날렸다. 영어만 있는 파일에서는 절대 안 생겨서 도구들이 못 보고 지나간다.
      #
      # 세 바이트(EF BF BD)를 printf 로 만들어 그대로 찾는다. 유니코드 이스케이프를
      # 쓴 패턴은 셸마다 다르게 먹힌다 - 이 저장소의 윈도우 셸에서는 빈 패턴이 되어
      # 모든 줄에 걸렸고, 그걸 믿고 없는 문제를 한참 쫓았다.
      #
      # 이 주석에 그 이스케이프를 예로 적었다가 heredoc 이 그것을 진짜 U+FFFD 한
      # 글자로 바꿔 넣었다. 깨진 글자를 찾는 검사를 쓰면서 깨진 글자를 만들었다.
      # 그래서 여기에는 그 모양을 적지 않는다.
      - name: 깨진 글자 검사
        run: |
          PAT=$(printf '\xef\xbf\xbd')
          if git grep -lF "$PAT" -- . ; then
            echo "::error::위 파일에 깨진 글자(U+FFFD)가 있습니다."
            exit 1
          fi
          echo "깨끗"

  # 진짜 엔진으로 한 판을 두고 복기까지 간다(e2e/core-flow.spec.ts). 단위 테스트는 엔진을
  # 가짜로 바꿔 끼우므로, 엔진(WASM)이 브라우저에서 뜨는지는 여기서만 본다.
  e2e:
    runs-on: ubuntu-latest
    # 새로 만든 E2E 라 간헐 실패가 줄 때까지 이 작업이 실패해도 CI 전체를 막지 않는다.
    # 작업 목록에는 실패로 보인다. 연속 10번 통과하면 이 줄을 지운다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 엔진 신경망(11MB)은 구글 드라이브에서 받는다. 드라이브는 데이터센터에서 자주 막히므로
      # 한 번 받아 검사를 마친 것(fetch-engine.mjs 의 CACHE_DIR)을 캐시에 두고 꺼내 쓴다.
      # 신경망 이름이 fetch-engine.mjs 에 있어서, 그 파일이 바뀔 때만 새로 받는다.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/janggi-engine
          key: janggi-engine-${{ hashFiles('scripts/fetch-engine.mjs') }}

      - name: 엔진 파일 준비
        run: node scripts/fetch-engine.mjs

      # 브라우저만 받는다. --with-deps 를 붙이면 시스템 라이브러리를 apt 로 받는데, 그것이
      # 때때로 초당 50KB 로 느려져 이 단계가 8분을 넘겼다(브라우저 본체는 7초). GitHub 의
      # Ubuntu 실행 환경에는 구글 크롬이 깔려 있어 필요한 라이브러리가 이미 있다. 실행 환경이
      # 바뀌어 모자라게 되면 E2E 가 없는 라이브러리 이름을 대며 바로 실패한다.
      - name: 브라우저 설치
        run: npx playwright install chromium

      - name: E2E
        run: npx playwright test

      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # 로그인·기보 올리기 E2E(e2e/server-flow.spec.ts). 백엔드 저장소(공개)를 받아 jar 로 띄우고,
  # Postgres 는 서비스로, 구글은 가짜(e2e/fake-google.mjs)로 둔다. 운영 DB·운영 서버에 닿지 않는다.
  # 백엔드는 main 의 최신 코드를 쓴다 - 둘이 지금 맞물리는지를 보는 자리다.
  e2e-server:
    runs-on: ubuntu-latest
    # 새로 만든 E2E 라 간헐 실패가 줄 때까지 CI 전체를 막지 않는다. 연속 10번 통과하면 이 줄을 지운다.
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Postgres 는 위 서비스가 띄웠다. 설정이 Docker 로 또 띄우지 않게 한다.
      E2E_DB_READY: "1"
      BACKEND_JAR: backend/build/libs/janggi-backend.jar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nakyung123/janggi-backend
          path: backend

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: 백엔드 jar 빌드
        working-directory: backend
        run: |
          ./gradlew --no-daemon bootJar
          # 판 번호가 붙은 이름을 정해진 이름으로 옮긴다. 설정이 이 경로를 본다(BACKEND_JAR).
          mv build/libs/janggi-backend-*[0-9].jar build/libs/janggi-backend.jar

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/janggi-engine
          key: janggi-engine-${{ hashFiles('scripts/fetch-engine.mjs') }}

      - name: 엔진 파일 준비
        run: node scripts/fetch-engine.mjs

      # --with-deps 를 붙이지 않는 까닭은 위 e2e 작업의 같은 단계에 적었다.
      - name: 브라우저 설치
        run: npx playwright install chromium

      - name: 로그인·기보 E2E
        run: npx playwright test -c playwright.server.config.ts

      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-server-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 14
